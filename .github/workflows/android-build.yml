name: Build Android App Bundle

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Gradle System
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Update SDK to 36
        run: |
          sed -i 's/compileSdkVersion = 35/compileSdkVersion = 36/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 36/g' android/variables.gradle || true
          sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' android/app/build.gradle || true
          sed -i 's/compileSdk 35/compileSdk 36/g' android/app/build.gradle || true

      - name: Build Android App Bundle (AAB)
        working-directory: ./android
        run: gradle bundleRelease -Pandroid.suppressUnsupportedCompileSdk=36

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
          
