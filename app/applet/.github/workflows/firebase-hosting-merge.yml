name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install && npm run build
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0777100836 }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" --project gen-lang-client-0777100836
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > service_account.json
            export GOOGLE_APPLICATION_CREDENTIALS=service_account.json
            npx firebase-tools deploy --only hosting --project gen-lang-client-0777100836
          else
            echo "⚠️ No Firebase token or service account secret found in GitHub Repository Secrets. Skipping automated deploy cleanly."
            exit 0
          fi
