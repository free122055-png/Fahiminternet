name: Build Android App Bundle

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix / Generate Robust Gradle Wrapper
        working-directory: ./android
        run: |
          rm -rf gradle/wrapper/gradle-wrapper.jar
          echo "Downloading Gradle 8.5 distribution to extract wrapper jar..."
          curl -L -o gradle-8.5-bin.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          cp gradle-8.5/lib/plugins/gradle-wrapper*.jar gradle/wrapper/gradle-wrapper.jar
          rm -rf gradle-8.5 gradle-8.5-bin.zip
          chmod +x gradlew
          echo "Gradle wrapper generated successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android App Bundle (AAB)
        working-directory: ./android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
