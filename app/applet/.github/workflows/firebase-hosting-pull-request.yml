name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    branches:
      - main

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install && npm run build
      - name: Deploy Preview to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0777100836 }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools hosting:channel:deploy preview --token "$FIREBASE_TOKEN" --project gen-lang-client-0777100836
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > service_account.json
            export GOOGLE_APPLICATION_CREDENTIALS=service_account.json
            npx firebase-tools hosting:channel:deploy preview --project gen-lang-client-0777100836
          else
            echo "⚠️ No Firebase token or service account secret found. Skipping preview deploy cleanly."
            exit 0
          fi
